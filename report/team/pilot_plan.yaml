# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# D1 · baseline 0.70; alpha 0.05; power 0.80; ICC 0.02.
# a) Chia theo yêu cầu: 1,251 yêu cầu/nhóm cho MDE 5 điểm.
# b) Theo nhân viên m=75: DE=2.48; 3,103 yêu cầu/nhóm, tương đương 42 nhân viên/nhóm; tổng 84 > 40, không đủ.
# c) 20 nhân viên/nhóm: hiệu dụng tối đa 20/0.02=1,000 < 1,251.
# d) 6 depot/nhóm: hiệu dụng tối đa 6/0.02=300.
# e) Chấp nhận MDE 6 điểm: n=859/nhóm; 20 nhân viên/nhóm cần m=299 yêu cầu/người (DE=6.96).
# D2: đối chứng chạy đồng thời; phân tầng theo depot, bốc thăm staff với seed lưu trước;
# rủi ro spillover trong depot giảm bằng quyền truy cập theo staff_id và log lượt mở;
# metric/ngưỡng/ngày quyết định đăng ký trước; có 20 cụm mỗi arm.
# Đánh đổi: nếu tác động thật chỉ 5 điểm, power xấp xỉ 0.64 với thiết kế 6 điểm.
# Tỉ lệ mở lại hiện tại 51/1,200=4.25%; trong scope noi_dia+hang_nang 3.97%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang: 2,696 đ (0.22x) và 8,221 đ (0.69x) mỗi việc thành công; số CPS simulated. Loại quoc_te (22,515 đ; 1.88x simulated) và doi_tac (10,215 đ; 0.85x simulated) khỏi pilot do độ phù hợp/phạm vi chính sách."
  assignment:
    unit: staff
    control_share: 0.5
    randomized: true
    stratification: depot
    randomization_seed: "ghi và khóa trước khi phân nhóm"
  rollout: [0.10, 0.25, 0.50]
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng chạy cùng tuần và trong cùng depot với 20 nhân viên can thiệp."
    spillover_risk: "Nhân viên cùng depot có thể chia sẻ gợi ý; giới hạn quyền truy cập theo staff_id và ghi event mở trợ lý theo staff_id."
    predeclared: "Đăng ký metric chính, MDE, luật dừng và ngày quyết định trước ngày bắt đầu; seed phân nhóm được lưu."
  stop_rules:
    - "NẾU mở lại 7 ngày ở nhóm trợ lý cao hơn đối chứng >= 2 điểm phần trăm hoặc vượt 6%, hoặc có >= 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp."
    - "NẾU chi phí mỗi việc thành công > 8.000 đ TRONG 2 tuần liên tiếp THÌ PM thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở hang_nang."
    - "NẾU tỉ lệ bỏ qua gợi ý > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout."
  interim_looks: "Chỉ kiểm tra chỉ số an toàn; không kiểm định sớm chỉ số chính."
  rollback: "Giám đốc vận hành kích hoạt cờ tắt; hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm."
  decision_date: "2027-01-05"
  simulated_inputs:
    - "Kết quả CPS phụ thuộc phút xem lại/làm lại *_simulated; các CPS và scope ratios 0.22x, 0.69x, 0.85x, 1.88x là ước tính simulated từ mẫu."
    - "Các ngưỡng dừng CPS 8.000 đ, chi phí nhân viên 12.000 đ/yêu cầu, mở lại +2 điểm/trần 6%, bỏ qua 40%, và tỷ lệ làm lại theo dõi 7% là ngưỡng vận hành đề xuất của bài tập; chưa được hiệu chuẩn/xác nhận ngoài dữ liệu lab."
  supplied_design_inputs:
    - "Baseline metric chính 0.70, MDE 0.06 (đánh đổi so với mục tiêu bài 5 điểm), alpha 0.05, power mục tiêu 0.80 và ICC 0.02 là tham số đề bài. Power xấp xỉ 0.64 nếu tác động thật chỉ là 5 điểm."
    - "Tỷ lệ mở lại 4.25% (51/1,200) và 3.97% trong scope là số mô tả tính từ dữ liệu giả lập của lab, không phải baseline được cấp sẵn."
    - "Ngưỡng an toàn/chi phí/sử dụng và ngày quyết định là đề xuất lập kế hoạch, không phải kết quả quan sát hoặc cam kết của chủ vai trò."
